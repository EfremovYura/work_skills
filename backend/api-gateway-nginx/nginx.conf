log_format json_analytics escape=json '{'
    '"time": "$time_iso8601", '
    '"remote_addr": "$remote_addr", '
    '"request_method": "$request_method", '
    '"request_uri": "$request_uri", '
    '"status": "$status", '
    '"body_bytes_sent": "$body_bytes_sent", '
    '"request_time": "$request_time", '
    '"http_referrer": "$http_referer", '
    '"http_user_agent": "$http_user_agent"'
'}';

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access_json.log json_analytics;
    error_log /var/log/nginx/error.log warn;

    location /api/v1/auth/ {
        proxy_pass http://auth-service:8000/api/v1/auth/;

        # Передаем реальные заголовки клиента внутрь сети Docker
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/orders/ {
        proxy_pass http://order-service:8000/api/v1/orders/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # For future frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
